<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d2733">
<title>Размеры на фото</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1b2430;--muted:#6b7686;--line:#d9dee5;--accent:#1f6feb;--danger:#d93a3a;--bar:#1d2733;--barInk:#e9eef5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.35;cursor:default}
.hidden{display:none!important}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header.top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--barInk);display:flex;align-items:center;gap:4px;padding:6px 8px;min-height:56px;padding-top:calc(6px + env(safe-area-inset-top))}
header.top h1{font-size:18px;margin:0 6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ibtn{min-width:44px;height:44px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.ibtn:active:not(:disabled){background:rgba(255,255,255,.15)}
/* список */
#listScreen{min-height:100%;display:flex;flex-direction:column}
.newbar{display:flex;gap:10px;padding:12px}
.big{flex:1;height:54px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.big.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
#projList{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:0 12px 24px}
.proj{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.proj .th{aspect-ratio:4/3;background:#dfe3e8 center/cover no-repeat;cursor:pointer}
.proj .info{padding:8px 10px 2px;cursor:pointer}
.proj .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .dt{font-size:12px;color:var(--muted)}
.proj .acts{display:flex;justify-content:flex-end;padding:0 4px 4px}
.proj .acts button{width:44px;height:40px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.proj .acts svg.i{width:20px;height:20px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
/* редактор */
#editor{position:fixed;inset:0;display:flex;flex-direction:column;background:#1f242b}
#edTitle{cursor:pointer}
#stage{flex:1;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:6px 12px;border-radius:16px;pointer-events:none;text-align:center}
#zoomBox{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#zoomBox button{width:44px;height:44px;border-radius:12px;background:rgba(20,25,32,.75);color:#fff;display:flex;align-items:center;justify-content:center}
#tools{display:flex;background:var(--bar);color:var(--barInk);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:12px}
.tool.on{background:var(--accent);color:#fff}
/* окна */
#ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:8vh 12px 12px;overflow:auto}
#mbox{background:var(--card);border-radius:16px;width:min(440px,100%);padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#mbox h3{margin:0 0 10px;font-size:18px}
.txt{margin:0 0 6px;white-space:pre-line}
.note{font-size:13px;color:var(--muted);margin:6px 0}
.inp{width:100%;height:50px;font:inherit;font-size:20px;border:1px solid var(--line);border-radius:10px;padding:0 12px;outline:none}
.inp:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{min-width:46px;height:40px;border-radius:20px;border:1px solid var(--line);background:#f5f7fa;padding:0 12px;font-size:17px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn{min-height:46px;padding:0 18px;border-radius:10px;background:#e8ecf1;font-weight:600}
.btn.pri{background:var(--accent);color:#fff}
.btn.dng{background:var(--danger);color:#fff}
.btn.ghost{background:none;color:var(--muted)}
.btn.block{display:block;width:100%;margin-top:8px}
.lbl{font-size:14px;color:var(--muted);margin:14px 0 6px}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid #cfd5dc;position:relative;overflow:hidden;display:block}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.rng{width:100%;height:32px}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px}
.chk input{width:22px;height:22px}
.prev{width:100%;height:130px;border-radius:10px;margin-top:14px;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0}
.seg button{flex:1;height:44px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222a33;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;font-size:14px;max-width:90%;text-align:center;pointer-events:none}
.tool span{white-space:nowrap;font-size:11px}
#ctxBar{position:absolute;left:8px;bottom:8px;right:60px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
#ctxBar::-webkit-scrollbar{display:none}
#ctxBar .cnt,#ctxBar button{flex:none;height:40px;padding:0 14px;border-radius:20px;background:rgba(20,25,32,.82);color:#fff;font-size:14px;display:flex;align-items:center;white-space:nowrap}
#ctxBar button.on{background:var(--accent)}
#ctxBar .sep{flex:none;width:1px;height:26px;background:rgba(255,255,255,.35)}
#edNote{position:relative}
#edNote.has::after{content:'';position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:#ffd600}
textarea.inp{height:auto;min-height:120px;padding:10px 12px;resize:vertical;font-size:17px;line-height:1.35}
.proj .cm{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#updBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));z-index:55;background:#222a33;color:#fff;border-radius:24px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:14px;white-space:nowrap}
#updBar button{background:var(--accent);color:#fff;border-radius:18px;height:36px;padding:0 14px;font-weight:600}
#bkLine{margin:0 12px 10px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:10px}
#bkLine.warn{border-color:#f0b429;background:#fff8e6}
#bkLine span{flex:1}
#bkLine button{color:var(--accent);font-weight:600;height:36px;padding:0 8px}
.radio{display:flex;align-items:flex-start;gap:10px;margin-top:8px;cursor:pointer}
.radio input{width:22px;height:22px;flex:none;margin:1px 0 0}
.radio small{display:block;color:var(--muted);font-size:13px}
.sect{font-weight:600;margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:10px 12px 0;font-size:14px;color:var(--muted)}
.crumbs button{color:var(--accent);padding:4px 2px;font-weight:600}
.chipsRow{display:flex;gap:8px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.chipsRow::-webkit-scrollbar{display:none}
.chipsRow button{flex:none;height:38px;padding:0 14px;border-radius:19px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chipsRow button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.proj{position:relative}
.proj.fold .th{display:flex;align-items:center;justify-content:center;background:#e7eef9;color:var(--accent)}
.proj.fold .th svg.i{width:56px;height:56px;stroke-width:1.5}
.proj.sel{outline:3px solid var(--accent);outline-offset:-2px}
.proj .tick{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid #9aa4b2;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;pointer-events:none}
.proj.sel .tick{background:var(--accent);border-color:var(--accent)}
.selMode .proj.fold{opacity:.4;pointer-events:none}
.selMode #projList{padding-bottom:140px}
#massBar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);display:flex;flex-wrap:wrap;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#massBar button{flex:1 1 auto;height:44px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
#massBar button.dng{background:var(--danger)}
.tree{max-height:55vh;overflow:auto;margin:0 -6px}
.tree button{display:block;width:100%;text-align:left;padding:11px 8px;border-radius:8px;font-size:16px}
.tree button:active{background:#eef2f7}
.tree small{color:var(--muted)}
.foot{margin-top:auto;padding:20px 12px calc(16px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
.selMode .foot{display:none}
#busy{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
#busy span{background:#fff;padding:14px 22px;border-radius:12px}
</style>
</head>
<body>

<div id="listScreen">
  <header class="top"><button class="ibtn hidden" id="lsBack" data-ic="back" aria-label="Назад"></button><h1 id="lsTitle">Размеры на фото</h1><button class="ibtn" id="lsMenu" data-ic="dots" aria-label="Меню"></button></header>
  <div id="crumbs" class="crumbs hidden"></div>
  <div class="newbar" id="newBar">
    <button class="big" id="btnGallery" data-ic="image">Из галереи</button>
    <button class="big alt" id="btnCamera" data-ic="camera">Камера</button>
  </div>
  <div class="chipsRow" id="lsChips"></div>
  <div id="bkLine" class="hidden"><span></span><button id="bkNow">Создать</button></div>
  <div id="projList"></div>
  <div id="emptyMsg" class="empty hidden"></div>
  <div id="massBar" class="hidden"></div>
  <div id="lsFoot" class="foot"></div>
</div>

<div id="editor" class="hidden">
  <header class="top">
    <button class="ibtn" id="edBack" data-ic="back" aria-label="Назад"></button>
    <h1 id="edTitle" title="Переименовать"></h1>
    <button class="ibtn" id="edNote" data-ic="note" aria-label="Комментарий"></button>
    <button class="ibtn" id="edUndo" data-ic="undo" aria-label="Отменить"></button>
    <button class="ibtn" id="edRedo" data-ic="redo" aria-label="Повторить"></button>
    <button class="ibtn" id="edExport" data-ic="download" aria-label="Экспорт"></button>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="ctxBar" class="hidden"></div>
    <div id="zoomBox">
      <button id="zIn" data-ic="plus" aria-label="Увеличить"></button>
      <button id="zOut" data-ic="minus" aria-label="Уменьшить"></button>
      <button id="zFit" data-ic="fit" aria-label="Вписать"></button>
    </div>
  </div>
  <nav id="tools">
    <button class="tool" id="tSelect" data-ic="pointer"><span>Выбор</span></button>
    <button class="tool" id="tDim" data-ic="dim"><span>Размер</span></button>
    <button class="tool" id="tLabel" data-ic="text"><span>Надпись</span></button>
    <button class="tool" id="tDraw" data-ic="pen"><span>Рисунок</span></button>
    <button class="tool" id="tStyle" data-ic="style"><span>Настройки</span></button>
  </nav>
</div>

<input type="file" id="fGallery" accept="image/*" hidden>
<input type="file" id="fCamera" accept="image/*" capture="environment" hidden>
<input type="file" id="fBackup" accept=".json,.txt,application/json,text/plain" hidden>
<div id="ov" class="hidden"><div id="mbox"></div></div>
<div id="toast" class="hidden"></div>
<div id="updBar" class="hidden"><span>Доступна новая версия</span><button id="updBtn">Обновить</button></div>
<div id="busy" class="hidden"><span>Подождите…</span></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const fmtDate=t=>new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const APP_ID='razmery-na-foto';
const APP_VERSION='1.6',APP_DATE='29.10.2026';

/* ---------- иконки ---------- */
const ICONS={back:'M15 18l-6-6 6-6',undo:'M9 14 4 9l5-5M4 9h11a5 5 0 0 1 0 10h-4',redo:'M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h4',
download:'M12 3v12M7 10l5 5 5-5M5 21h14',pointer:'M5 3l6 16 2.5-6.5L20 10z',dim:'M3 6v12M21 6v12M3 12h18M7 9l-4 3 4 3M17 9l4 3-4 3',
text:'M5 7V4h14v3M12 4v16M9 20h6',trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',
style:'M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3c2.6 0 4.7-2.1 4.7-4.7C22 5.9 17.5 3 12 3zM7.5 11h.01M10.5 7h.01M15.5 7.5h.01',
plus:'M12 5v14M5 12h14',minus:'M5 12h14',fit:'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',
camera:'M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',image:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4',
dots:'M12 5h.01M12 12h.01M12 19h.01',folder:'M3 6h6l2 2h10v11H3z',restore:'M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4',flip:'M7 20V4M3 8l4-4 4 4M17 4v16M13 16l4 4 4-4',note:'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5',pen:'M4 20l4-1 11-11-3-3L5 16zM14 6l3 3',edit:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24"${n==='dots'?' style="stroke-width:3.5"':''}><path d="${ICONS[n]}"/></svg>`;
document.querySelectorAll('[data-ic]').forEach(el=>el.insertAdjacentHTML('afterbegin',ic(el.dataset.ic)));

/* ---------- IndexedDB ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('razmery_na_foto',1);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});
    if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function txDone(t){return new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'));});}
function reqP(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const dbGet=(s,k)=>reqP(db.transaction(s).objectStore(s).get(k));
const dbAll=s=>reqP(db.transaction(s).objectStore(s).getAll());
function dbPut(s,v){const t=db.transaction(s,'readwrite');t.objectStore(s).put(v);return txDone(t);}
function dbPutMany(items){const names=[...new Set(items.map(i=>i[0]))];const t=db.transaction(names,'readwrite');
  items.forEach(([s,v])=>t.objectStore(s).put(v));return txDone(t);}
function dbDelMany(ids){const t=db.transaction(['projects','photos'],'readwrite');
  for(const id of ids){t.objectStore('projects').delete(id);t.objectStore('photos').delete(id);}return txDone(t);}
function dbDelProject(id){const t=db.transaction(['projects','photos'],'readwrite');
  t.objectStore('projects').delete(id);t.objectStore('photos').delete(id);return txDone(t);}

/* ---------- настройки ---------- */
let settings={color:'#e53935',lw:3,fs:36,halo:true,placeMode:'click3'};
let bkInfo={lastExport:0,lastImport:0};
async function loadBk(){try{const r=await dbGet('meta','backup');if(r&&r.value)bkInfo={...bkInfo,...r.value};}catch(e){}}
function saveBk(){dbPut('meta',{key:'backup',value:bkInfo}).catch(()=>{});}
async function loadSettings(){try{const r=await dbGet('meta','settings');if(r&&r.value)settings={...settings,...r.value};}catch(e){}}
function saveSettings(){dbPut('meta',{key:'settings',value:settings}).catch(()=>{});}

/* ---------- утилиты ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),2600);}
function busy(on,msg){$('#busy span').textContent=msg||'Подождите…';$('#busy').classList.toggle('hidden',!on);}
function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const im=new Image();
  im.onload=()=>res(im);im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'));};im.src=u;});}
const toBlob=(c,type,q)=>new Promise(res=>c.toBlob(res,type,q));
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
function dataUrlToBlob(u){const i=u.indexOf(',');const type=u.slice(5,i).split(';')[0];const bin=atob(u.slice(i+1));
  const a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type});}
function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
const safeName=s=>(s||'проект').replace(/[\\/:*?"<>|]+/g,'_').trim().slice(0,80)||'проект';

/* ---------- окна ---------- */
let modalClose=null;
function modal(build){return new Promise(res=>{const ov=$('#ov'),box=$('#mbox');box.innerHTML='';ov.classList.remove('hidden');
  let done=false;const close=v=>{if(done)return;done=true;ov.classList.add('hidden');box.innerHTML='';modalClose=null;res(v===undefined?null:v);};
  modalClose=close;build(box,close);});}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&modalClose)modalClose(null);});
function insertAtCursor(inp,s){const a=inp.selectionStart??inp.value.length,b=inp.selectionEnd??a;
  inp.value=inp.value.slice(0,a)+s+inp.value.slice(b);inp.selectionStart=inp.selectionEnd=a+s.length;inp.focus();}
function askText(title,value,opts={}){return modal((box,close)=>{
  box.innerHTML=`<h3></h3>${opts.multiline?'<textarea class="inp" rows="4"></textarea>':'<input type="text" class="inp" autocomplete="off" enterkeyhint="done">'}${opts.chips?'<div class="chips"></div>':''}
  <div class="mbtns"><button class="btn" data-a="c">Отмена</button><button class="btn pri" data-a="ok">OK</button></div>`;
  box.querySelector('h3').textContent=title;const inp=box.querySelector('.inp');inp.value=value||'';inp.placeholder=opts.placeholder||'';
  if(opts.chips){const cr=box.querySelector('.chips');for(const [lab,ins] of opts.chips){const b=document.createElement('button');
    b.className='chip';b.textContent=lab;b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>insertAtCursor(inp,ins);cr.appendChild(b);}}
  box.querySelector('[data-a=c]').onclick=()=>close(null);
  box.querySelector('[data-a=ok]').onclick=()=>close(inp.value.trim());
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&(!opts.multiline||e.ctrlKey||e.metaKey)){e.preventDefault();close(inp.value.trim());}});
  setTimeout(()=>{inp.focus();if(opts.caretEnd){const n=inp.value.length;inp.setSelectionRange(n,n);}else inp.select();},50);});}

function makeDim(a,b){const base=Math.max(proj.w,proj.h)/1000;

  ctx.fillStyle='#1f6feb';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#fff';ctx.stroke();}
function drawOverlay(){
  const L=selList(),one=L.length===1;
  ctx.save();ctx.setLineDash([6,5]);ctx.strokeStyle='#4da3ff';ctx.lineWidth=one?1.5:2.5;
  for(const o of L){ctx.beginPath();
    if(isDim(o)){const g=dimGeom(o);if(!g)continue;const a=toScr(g.ax,g.ay),b=toScr(g.bx,g.by),p1=toScr(o.x1,o.y1),p2=toScr(o.x2,o.y2);
      ctx.moveTo(p1.x,p1.y);ctx.lineTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(p2.x,p2.y);}
    else{const Bx=objBounds(o),a=toScr(Bx.x0,Bx.y0),b=toScr(Bx.x1,Bx.y1),m=6;ctx.rect(a.x-m,a.y-m,b.x-a.x+2*m,b.y-a.y+2*m);}

  const mks=mode==='create'?(dimKind==='lin'?(tmpP1?[tmpP1]:[]):mpts):(mode==='text'&&tmpTip)?[tmpTip]:[];
  for(const mk of mks){const p=toScr(mk.x,mk.y);ctx.save();
    for(const [col,w] of [['rgba(0,0,0,.7)',4],['#ffeb3b',2]]){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();
      ctx.moveTo(p.x-12,p.y);ctx.lineTo(p.x+12,p.y);ctx.moveTo(p.x,p.y-12);ctx.lineTo(p.x,p.y+12);ctx.stroke();}ctx.restore();}}
function drawLoupe(){
  const R=62,gap=R+50;let cx=clamp(loupe.sx,R+6,cw-R-6),cy=loupe.sy-gap;if(cy<R+6)cy=loupe.sy+gap;

  ctx.translate(cx,cy);ctx.scale(z,z);ctx.translate(-loupe.ix,-loupe.iy);ctx.drawImage(img,0,0,proj.w,proj.h);
  drawAll(ctx);ctx.restore();
  ctx.save();for(const [col,w] of [['rgba(0,0,0,.7)',3],['#fff',1.2]]){ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();
    ctx.moveTo(cx-R+8,cy);ctx.lineTo(cx-5,cy);ctx.moveTo(cx+5,cy);ctx.lineTo(cx+R-8,cy);

  ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke();
  ctx.lineWidth=1;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.arc(cx,cy,R+2,0,Math.PI*2);ctx.stroke();ctx.restore();}

/* ---------- попадание ---------- */
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;const t=l?clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;return Math.hypot(px-ax-t*dx,py-ay-t*dy);}
function hitObj(p){const q=toImg(p),tol=20/view.s;let best=null,bd=Infinity;
  for(const o of dims){const m=objDist(o,q);if(m<tol&&m<=bd){bd=m;best=o;}}return best;}
function objHandles(o){
  if(isDim(o)){const g=dimGeom(o);if(!g)return [];const oh=offHandle(g);return [{k:'p1',x:o.x1,y:o.y1},{k:'p2',x:o.x2,y:o.y2},{k:'off',x:oh.x,y:oh.y,dia:true}];}

  if(o.type==='pen')return [];
  if(o.type==='angle'){const P=angleParts(o),hs=[{k:'v',x:o.cx,y:o.cy},{k:'a',x:o.x1,y:o.y1},{k:'b',x:o.x2,y:o.y2}];
    if(P){const am=P.arc.a1+P.arc.d/2;hs.push({k:'r',x:o.cx+Math.cos(am)*P.arc.r,y:o.cy+Math.sin(am)*P.arc.r,dia:true});}return hs;}

function hitHandle(p){const o=selDim();if(!o)return null;let best=null,bd=30;

/* ---------- жесты ---------- */
const ptrs=new Map();let act=null,pinch=null,locked=false,lastTap={t:0,id:null};
function pos(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
function cancelAct(){if(!act)return;
  if(act.k==='handle')Object.assign(act.d,JSON.parse(act.snap));
  if(act.k==='move')act.targets.forEach((o,i)=>Object.assign(o,JSON.parse(act.snaps[i])));
  if(act.k==='place'&&!tmpP2)pendingDim=null;
  if(act.k==='draw'||act.k==='lplace'||act.k==='mplace')pendingObj=null;
  act=null;loupe=null;render();}
function placeAt(p){const ip=clampImg(toImg(p));act.ip=ip;if(tmpP1)pendingDim=makeDim(tmpP1,ip);
  loupe=act.touchy?{ix:ip.x,iy:ip.y,sx:p.x,sy:p.y}:null;render();}
function offsetAt(p){const d=pendingDim;if(!d)return;const ip=toImg(p),g=dimGeom(d);if(g)d.off=(ip.x-d.x1)*g.nx+(ip.y-d.y1)*g.ny;render();}
function handleMove(p){const ip=toImg(p),x=ip.x+act.gx,y=ip.y+act.gy,o=act.d;
  if(act.h==='off'){const g=dimGeom(o);if(g)o.off=(x-o.x1)*g.nx+(y-o.y1)*g.ny;loupe=null;}
  else if(act.h==='r'){o.r=Math.max(o.fs*0.6,Math.hypot(x-o.cx,y-o.cy));loupe=null;}
  else{const c=clampImg({x,y});
    if(act.h==='v'){o.cx=c.x;o.cy=c.y;}else if(act.h==='p1'||act.h==='a'){o.x1=c.x;o.y1=c.y;}else if(act.h==='p2'||act.h==='b'){o.x2=c.x;o.y2=c.y;}else if(act.h==='tip')o.tip={x:c.x,y:c.y};
    loupe=act.touchy?{ix:c.x,iy:c.y,sx:p.x,sy:p.y}:null;}
  render();}
function newBase(){const base=Math.max(proj.w,proj.h)/1000;return {id:uid(),color:settings.color,lw:settings.lw*base,fs:settings.fs*base,halo:settings.halo};}
function startDraw(p){const ip=clampImg(toImg(p)),o={...newBase(),type:tool};
  if(tool==='pen')o.pts=[[ip.x,ip.y]];else{o.x1=o.x2=ip.x;o.y1=o.y2=ip.y;}
  pendingObj=o;act={k:'draw',lastS:p};render();}
function moveDraw(p){const o=pendingObj;if(!o)return;const ip=clampImg(toImg(p));
  if(o.type==='pen'){if(Math.hypot(p.x-act.lastS.x,p.y-act.lastS.y)<2)return;act.lastS=p;o.pts.push([ip.x,ip.y]);}
  else{o.x2=ip.x;o.y2=ip.y;}render();}
function finishDraw(){const o=pendingObj;pendingObj=null;if(!o){render();return;}
  if(o.type==='pen'&&o.pts.length<2){render();return;}
  const Bx=objBounds(o);if(Math.max(Bx.x1-Bx.x0,Bx.y1-Bx.y0)*view.s<8){render();return;}

function buildMeas(kind,P){const b=newBase();
  if(kind==='angle'){if(P.length<3)return null;const l1=Math.hypot(P[1].x-P[0].x,P[1].y-P[0].y),l2=Math.hypot(P[2].x-P[0].x,P[2].y-P[0].y);
    return {...b,type:'angle',cx:P[0].x,cy:P[0].y,x1:P[1].x,y1:P[1].y,x2:P[2].x,y2:P[2].y,r:Math.max(b.fs*1.5,Math.min(l1,l2)*0.6),rev:false,text:''};}
  if(P.length<2)return null;
  const o={...b,type:kind,x1:P[0].x,y1:P[0].y,x2:P[1].x,y2:P[1].y,text:kind==='diam'?'Ø':'R',ts:1};
  const L=Math.hypot(o.x2-o.x1,o.y2-o.y1)||1,ny=(o.x2-o.x1)/L;if(ny>1e-6)o.ts=-1;return o;}
function mplaceAt(p){const ip=clampImg(toImg(p));act.ip=ip;loupe=act.touchy?{ix:ip.x,iy:ip.y,sx:p.x,sy:p.y}:null;
  pendingObj=buildMeas(dimKind,[...mpts,ip]);render();}
async function finishMplace(a){const ip=a.ip;if(!ip)return;

  mpts.push(ip);const need=dimKind==='angle'?3:2;

  o.text=v;pushHistory();dims.push(o);selSet=new Set([o.id]);changed();}
function lplaceAt(p){const ip=clampImg(toImg(p));act.ip=ip;loupe=act.touchy?{ix:ip.x,iy:ip.y,sx:p.x,sy:p.y}:null;
  if(tmpTip)pendingObj={...newBase(),type:'text',x:ip.x,y:ip.y,text:'Текст',tip:{...tmpTip}};render();}
async function finishLplace(a){const ip=a.ip;if(!ip)return;
  if(labelMode==='leader'&&!tmpTip){tmpTip=ip;updateUI();render();return;}
  const o={...newBase(),type:'text',x:ip.x,y:ip.y,text:'…',tip:tmpTip?{...tmpTip}:null};tmpTip=null;pendingObj=o;updateUI();render();

  if(t==='dim')return {...b,x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2,off:d.off,text:d.text};
  if(t==='text')return {...b,type:'text',x:d.x,y:d.y,text:d.text,tip:d.tip?{x:d.tip.x,y:d.tip.y}:null};
  if(t==='diam'||t==='rad')return {...b,type:t,x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2,text:d.text,ts:d.ts===-1?-1:1};
  if(t==='angle')return {...b,type:'angle',cx:d.cx,cy:d.cy,x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2,r:d.r,rev:!!d.rev,text:d.text};
  if(t==='pen')return {...b,type:'pen',pts:d.pts.map(p=>[p[0],p[1]])};
  return {...b,type:t,x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2};}
$('#fBackup').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importBackup(f);};
async function importBackup(file){
  busy(true,'Проверка файла…');let data;
  try{data=JSON.parse(await file.text());validateBackup(data);
    for(const p of data.projects){p._blob=dataUrlToBlob(p.photo);const im=await loadImg(p._blob);p._im=im;}}
  catch(e){busy(false);for(const p of (data&&data.projects)||[])if(p&&p._im)URL.revokeObjectURL(p._im.src);
    await alertBox('Импорт невозможен',typeof e==='string'?e:'Файл повреждён или имеет неверный формат. Данные не изменены.');return;}
  busy(false);
  const freeImgs=()=>data.projects.forEach(p=>p._im&&URL.revokeObjectURL(p._im.src));
  const existing=await dbAll('projects'),exIds=new Set(existing.map(p=>p.id)),exNames=new Set(existing.filter(p=>!p.deleted).map(p=>(p.folderId||'')+'|'+p.name));
  const n=data.projects.length,conf=data.projects.filter(p=>exIds.has(p.id)).length;
  let policy='new';
  if(conf){policy=await choose('Восстановление',`${isNum(data.exported)?'Копия от '+fmtDate(data.exported)+'.\n':''}В копии проектов: ${n}.\nУже есть на устройстве: ${conf}.\nКак поступить с совпадающими?`,
      [{k:'skip',l:'Пропустить совпадающие'},{k:'copy',l:'Добавить как копии'},{k:'replace',l:'Заменить существующие',cls:'dng'}]);
    if(!policy){freeImgs();return;}
    if(policy==='replace'&&!await confirmBox('Заменить проекты?',`Текущие версии ${conf} проект(ов) будут заменены данными из копии.`,'Заменить',true)){freeImgs();return;}}
  else if(!await confirmBox('Восстановление',`${isNum(data.exported)?'Копия от '+fmtDate(data.exported)+'. ':''}Будет добавлено проектов: ${n}. Существующие проекты не изменятся.`,'Восстановить')){freeImgs();return;}
  busy(true,'Восстановление…');
  try{const uniq=(base,fk)=>{let nm=base,i=2;while(exNames.has(fk+'|'+nm))nm=`${base} (${i++})`;return nm;};
    const items=[];let added=0,replaced=0,skipped=0;
    const fIds=new Set(folders.map(f=>f.id)),newF=folders.map(f=>({...f}));
    for(const f of (data.folders||[]))if(!fIds.has(f.id)){newF.push({id:f.id,name:f.name,parent:typeof f.parent==='string'?f.parent:null});fIds.add(f.id);}
    newF.forEach(f=>{if(f.parent&&!fIds.has(f.parent))f.parent=null;});
    for(const p of data.projects){let id=p.id,name=p.name||'Проект';const fk=typeof p.folderId==='string'&&fIds.has(p.folderId)?p.folderId:'';
      if(exIds.has(id)){if(policy==='skip'){skipped++;continue;}
        if(policy==='copy'){id=uid();name=uniq(name+' (копия)',fk);added++;}else replaced++;}
      else{if(exNames.has(fk+'|'+name))name=uniq(name+' (восстановлен)',fk);added++;}
      const now=Date.now();
      const rec={id,name,created:isNum(p.created)?p.created:now,modified:isNum(p.modified)?p.modified:now,w:p.w,h:p.h,dims:p.dims.map(cleanObj),comment:typeof p.comment==='string'?p.comment:'',commentOnExport:!!p.commentOnExport,folderId:typeof p.folderId==='string'&&fIds.has(p.folderId)?p.folderId:null};
      rec.thumb=await makeThumb(p._im,rec,rec.dims);items.push(['projects',rec],['photos',{id,blob:p._blob}]);}
    items.push(['meta',{key:'folders',value:newF}]);await dbPutMany(items);folders=newF;
    freeImgs();busy(false);bkInfo.lastImport=Date.now();saveBk();renderList();
    alertBox('Готово',`Добавлено: ${added}\nЗаменено: ${replaced}\nПропущено: ${skipped}`);}
  catch(e){freeImgs();busy(false);alertBox('Ошибка','Не удалось записать данные. Существующие проекты не изменены.');}}
async function showStorage(){
  const ps=await dbAll('projects');let txt=`Проектов: ${ps.length}`;
  try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();
    txt+=`\nЗанято: ${(e.usage/1048576).toFixed(1)} МБ из доступных ~${(e.quota/1048576).toFixed(0)} МБ`;}
    if(navigator.storage&&navigator.storage.persisted)txt+=`\nЗащита от автоочистки: ${await navigator.storage.persisted()?'включена':'не предоставлена браузером'}`;}catch(e){}
  txt+=`\nПоследняя копия: ${bkInfo.lastExport?fmtDate(bkInfo.lastExport):'не создавалась'}\nПоследнее восстановление: ${bkInfo.lastImport?fmtDate(bkInfo.lastImport):'не выполнялось'}`;
  txt+='\n\nДанные хранятся только в этом браузере. Регулярно делайте резервную копию.';
  alertBox('Хранилище',txt);}
$('#lsMenu').onclick=async()=>{
  const k=await choose('Меню','',[{k:'bk',l:'Создать резервную копию'},{k:'rs',l:'Восстановить из резервной копии'},{k:'st',l:'Настройки'},{k:'tr',l:'Корзина'},{k:'inf',l:'Хранилище'},{k:'up',l:'Проверить обновления'}]);
  if(k==='bk')exportBackup();else if(k==='rs')$('#fBackup').click();else if(k==='st')openSettings();else if(k==='inf')showStorage();else if(k==='up')checkUpdate();else if(k==='tr'&&!trashView)navPush('trash');};

/* ---------- запуск ---------- */
(async()=>{
  try{db=await openDB();}catch(e){alertBox('Хранилище недоступно','Браузер не дал доступ к IndexedDB. Проекты не смогут сохраняться.');return;}
  await loadSettings();await loadBk();await loadFolders();await purgeTrash();renderList();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
})();
/* ---------- обновление приложения ---------- */
let swReg=null;
const showUpd=()=>$('#updBar').classList.remove('hidden');
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloading)return;reloading=true;location.reload();});
  navigator.serviceWorker.register('sw.js').then(reg=>{swReg=reg;
    if(reg.waiting&&navigator.serviceWorker.controller)showUpd();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpd();});});
  }).catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&swReg)swReg.update().catch(()=>{});});
}
async function checkUpdate(){
  if(!swReg){toast('Обновления доступны только в установленной версии');return;}
  if(swReg.waiting){showUpd();return;}
  toast('Проверка…');try{await swReg.update();}catch(e){toast('Нет связи с сервером');return;}
  setTimeout(()=>{if(swReg.waiting||swReg.installing)showUpd();else toast(`Установлена последняя версия (${APP_VERSION})`);},1500);}
$('#updBtn').onclick=async()=>{if(proj)await flushAll();const w=swReg&&swReg.waiting;if(w)w.postMessage('SKIP_WAITING');else location.reload();};
</script>
