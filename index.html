<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d2733">
<title>Размеры на фото</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#1b2430;--muted:#6b7686;--line:#d9dee5;--accent:#1f6feb;--danger:#d93a3a;--bar:#1d2733;--barInk:#e9eef5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.35;cursor:default}
.hidden{display:none!important}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header.top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--barInk);display:flex;align-items:center;gap:4px;padding:6px 8px;min-height:56px;padding-top:calc(6px + env(safe-area-inset-top))}
header.top h1{font-size:18px;margin:0 6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ibtn{min-width:44px;height:44px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.ibtn:active:not(:disabled){background:rgba(255,255,255,.15)}
/* список */
#listScreen{min-height:100%;display:flex;flex-direction:column}
.newbar{display:flex;gap:10px;padding:12px}
.big{flex:1;height:54px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.big.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
#projList{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 12px 24px}
#projList.g3{grid-template-columns:repeat(3,1fr);gap:8px}
#projList.g4{grid-template-columns:repeat(4,1fr);gap:6px}
@media(min-width:700px){#projList{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}#projList.g3{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}#projList.g4{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}
.g3 .proj .dt,.g4 .proj .dt,.g3 .proj .cm,.g4 .proj .cm{display:none}
.g3 .proj .nm,.g4 .proj .nm{font-size:13px}
.g4 .proj .info{padding:6px 6px 0}
.g3 .proj .acts button{width:36px}
.g4 .proj .acts button{width:30px;height:32px}
.g4 .proj .acts svg.i{width:16px;height:16px}
.g4 .proj.fold .th svg.i{width:34px;height:34px}
.g4 .proj .tick{width:22px;height:22px;top:4px;left:4px;font-size:12px}
.proj{background:var(--card);border-radius:12px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column}
.proj .th{aspect-ratio:4/3;background:#dfe3e8 center/cover no-repeat;cursor:pointer}
.proj .info{padding:8px 10px 2px;cursor:pointer}
.proj .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .dt{font-size:12px;color:var(--muted)}
.proj .acts{display:flex;justify-content:flex-end;padding:0 4px 4px}
.proj .acts button{width:44px;height:40px;border-radius:8px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.proj .acts svg.i{width:20px;height:20px}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
/* редактор */
#editor{position:fixed;inset:0;display:flex;flex-direction:column;background:#1f242b}
#edTitle{cursor:pointer}
#edTitle::after{content:' ▾';opacity:.55;font-weight:400}
#stage{flex:1;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:6px 12px;border-radius:16px;pointer-events:none;text-align:center}
#zoomBox{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#zoomBox button{width:44px;height:44px;border-radius:12px;background:rgba(20,25,32,.75);color:#fff;display:flex;align-items:center;justify-content:center}
#tools{display:flex;background:var(--bar);color:var(--barInk);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:12px}
.tool.on{background:var(--accent);color:#fff}
/* окна */
#ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:8vh 12px 12px;overflow:auto}
#mbox{background:var(--card);border-radius:16px;width:min(440px,100%);padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#mbox h3{margin:0 0 10px;font-size:18px}
.txt{margin:0 0 6px;white-space:pre-line}
.note{font-size:13px;color:var(--muted);margin:6px 0}
.inp{width:100%;height:50px;font:inherit;font-size:20px;border:1px solid var(--line);border-radius:10px;padding:0 12px;outline:none}
.inp:focus{border-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{min-width:46px;height:40px;border-radius:20px;border:1px solid var(--line);background:#f5f7fa;padding:0 12px;font-size:17px}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn{min-height:46px;padding:0 18px;border-radius:10px;background:#e8ecf1;font-weight:600}
.btn.pri{background:var(--accent);color:#fff}
.btn.dng{background:var(--danger);color:#fff}
.btn.ghost{background:none;color:var(--muted)}
.btn.block{display:block;width:100%;margin-top:8px}
.lbl{font-size:14px;color:var(--muted);margin:14px 0 6px}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid #cfd5dc;position:relative;overflow:hidden;display:block}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.rng{width:100%;height:32px}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px}
.chk input{width:22px;height:22px}
.prev{width:100%;height:130px;border-radius:10px;margin-top:14px;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:12px 0}
.seg button{flex:1;height:44px;font-weight:600}
.seg button.on{background:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222a33;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;font-size:14px;max-width:90%;text-align:center;pointer-events:none}
.tool span{white-space:nowrap;font-size:11px}
#edNote{position:relative}
#hint{pointer-events:none}
#hint .hx{pointer-events:auto;display:inline-block;margin:-6px -8px -6px 4px;padding:6px 10px;opacity:.75;cursor:pointer}
#hintQ{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:rgba(20,25,32,.75);color:#fff;font-weight:700;font-size:17px}
.tabs{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:4px 0 6px}
.tabs button{flex:1;height:40px;font-weight:600;font-size:14px}
.tabs button.on{background:var(--accent);color:#fff}
.recent{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.recent .chip{background:#e7eef9;border-color:#c9d8f0}
.calc{display:flex;align-items:center;gap:8px;margin:6px 2px 0;color:var(--accent);font-weight:600}
.calc .cx{margin-left:auto;font-size:13px;color:var(--muted);text-decoration:underline;font-weight:400}
.tolb{margin-top:8px;font-size:14px;color:var(--muted);padding:6px 0}.tolb.on{color:var(--accent)}
.tolf{display:flex;gap:8px}.tolf .inp{flex:1;min-width:0}
#dropOv{position:fixed;inset:0;z-index:300;background:rgba(31,111,235,.18);border:3px dashed var(--accent);display:flex;align-items:center;justify-content:center;pointer-events:none}
#dropOv div{background:#fff;color:#1f2933;padding:14px 20px;border-radius:12px;font-size:17px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.srch{margin:0 12px 10px;position:relative}
.srch input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 36px 0 12px;font:inherit;font-size:15px;background:var(--card);outline:none}
.srch input:focus{border-color:var(--accent)}
.srch button{position:absolute;right:4px;top:4px;width:34px;height:34px;color:var(--muted);font-size:18px}
.proj .path{font-size:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lsSync{position:relative}
#lsSync.has::after,#edNote.has::after{content:'';position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:#ffd600}
textarea.inp{height:auto;min-height:120px;padding:10px 12px;resize:vertical;font-size:17px;line-height:1.35}
.proj .cm{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#updBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));z-index:55;background:#222a33;color:#fff;border-radius:24px;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:14px;white-space:nowrap}
#updBar button{background:var(--accent);color:#fff;border-radius:18px;height:36px;padding:0 14px;font-weight:600}
#bkLine{margin:0 12px 10px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:10px}
#bkLine.warn{border-color:#f0b429;background:#fff8e6}
#bkLine span{flex:1}
#bkLine button{color:var(--accent);font-weight:600;height:36px;padding:0 8px}
.radio{display:flex;align-items:flex-start;gap:10px;margin-top:8px;cursor:pointer}
.radio input{width:22px;height:22px;flex:none;margin:1px 0 0}
.radio small{display:block;color:var(--muted);font-size:13px}
.sect{font-weight:600;margin:18px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:10px 12px 0;font-size:14px;color:var(--muted)}
.crumbs button{color:var(--accent);padding:4px 2px;font-weight:600}
.chipsRow{display:flex;flex-wrap:wrap;gap:8px;padding:0 12px 10px}
.chipsRow::-webkit-scrollbar{display:none}
.chipsRow button{flex:none;height:38px;padding:0 14px;border-radius:19px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chipsRow button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.proj{position:relative}
.proj.fold .th{display:flex;align-items:center;justify-content:center;background:#e7eef9;color:var(--accent)}
.proj.fold .th svg.i{width:56px;height:56px;stroke-width:1.5}
.proj.sel{outline:3px solid var(--accent);outline-offset:-2px}
.proj .tick{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid #9aa4b2;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;pointer-events:none}
.proj.sel .tick{background:var(--accent);border-color:var(--accent)}
.selMode .proj.fold{opacity:.4;pointer-events:none}
.selMode #projList{padding-bottom:140px}
#massBar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);display:flex;flex-wrap:wrap;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
#massBar button{flex:1 1 auto;height:44px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
#massBar button.dng{background:var(--danger)}
.tree{max-height:55vh;overflow:auto;margin:0 -6px}
.tree button{display:block;width:100%;text-align:left;padding:11px 8px;border-radius:8px;font-size:16px}
.tree button:active{background:#eef2f7}
.tree small{color:var(--muted)}
.inp.sm{height:44px;font-size:15px}
.row2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row2 .btn{flex:1 1 auto}
.mfoot{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);text-align:center;font-size:12px;color:var(--muted);line-height:1.7}
.stItems{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.stItem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:4px 6px}
.stItem img{width:56px;height:42px;object-fit:cover;border-radius:6px;background:#ddd}
.stItem span{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stItem button{width:36px;height:36px;border-radius:8px;background:#eef2f7;font-size:16px}
.stPrev{width:100%;max-height:34vh;object-fit:contain;display:block;margin-top:10px;border-radius:8px;background:repeating-conic-gradient(#e5e8ec 0 25%,#f5f6f8 0 50%) 0 0/16px 16px}
#adj{position:fixed;inset:0;z-index:55;background:#14181d;display:flex;flex-direction:column;color:#fff}
#adj .ah{display:flex;align-items:center;gap:8px;padding:8px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--bar)}
#adj .ah b{flex:1;font-size:17px;text-align:center}
#adj .ah button{height:40px;padding:0 14px;border-radius:10px;font-weight:600;color:#fff}
#adj .ah .go{background:var(--accent)}
#adj .nm{margin:8px 10px 0;height:44px;border-radius:10px;border:0;padding:0 12px;font:inherit;font-size:16px}
#adj .cv{flex:1;position:relative;touch-action:none;min-height:120px}
#adj canvas{position:absolute;inset:0;width:100%;height:100%}
#adj .ctl{padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:var(--bar)}
#adj .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#adj .row button{height:38px;padding:0 12px;border-radius:19px;background:rgba(255,255,255,.12);color:#fff;font-size:14px}
#adj .row button.on{background:var(--accent)}
#adj input[type=range]{flex:1;min-width:120px}
#adj .ang{min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
#sheetNav{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:2px;background:rgba(20,25,32,.82);border-radius:20px;color:#fff;z-index:2}
#sheetNav button{width:40px;height:40px;font-size:15px;color:#fff}
#sheetNav button:disabled{opacity:.3}
#sheetNav .sn{min-width:52px;text-align:center;font-size:14px;cursor:pointer}
#stage.hasNav #hint{top:56px}
.pgGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pg{position:relative;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:#f2f4f7;aspect-ratio:0.72;cursor:pointer}
.pg canvas{width:100%;height:100%;object-fit:contain;display:block}
.pg span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:1px 6px;border-radius:8px}
.pg.on{border-color:var(--accent)}
.pg.on::after{content:'✓';position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.pgTools{display:flex;gap:6px;align-items:center;margin-top:8px}
.pgTools input{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;font-size:15px;min-width:0}
.pgTools button{height:40px;padding:0 12px;border-radius:10px;background:#eef2f7;font-size:14px;font-weight:600}
.mbtns.stick{position:sticky;bottom:-18px;background:var(--card);margin:12px -18px -18px;padding:12px 18px;border-top:1px solid var(--line);border-radius:0 0 16px 16px;z-index:1}
#subBar{display:flex;gap:4px;background:#161b21;padding:6px 6px 4px}
#subBar button{flex:1;height:50px;border-radius:6px;background:rgba(255,255,255,.08);color:#e9eef5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
#subBar button b{font-size:19px;line-height:1;font-weight:600}
#subBar button span{font-size:11px;opacity:.85}
#subBar button.on{background:var(--accent);color:#fff}
#subBar button.sty{flex:0 0 46px;background:transparent}
#subBar button.sty.own span{color:#7cc4ff;font-weight:600}
#subBar button.sty i{width:18px;height:18px;border-radius:50%;display:block;margin-bottom:3px}
#ctxBar{display:flex;gap:4px;background:#161b21;padding:6px 6px 0}
#ctxBar button{flex:1;min-width:0;height:48px;border-radius:6px;background:rgba(255,255,255,.08);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;line-height:1.1}
#ctxBar button svg.i{width:21px;height:21px}
#ctxBar button.on{background:var(--accent)}
#ctxBar .cnt{flex:0 0 50px;font-size:14px;font-weight:700}
#ctxBar .dng{color:#ff8a80}
#morePop{position:absolute;right:6px;bottom:6px;z-index:4;display:flex;gap:4px;background:rgba(20,25,32,.95);border-radius:10px;padding:4px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#morePop button{width:60px;height:54px;border-radius:8px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;line-height:1.1}
#morePop button svg.i{width:22px;height:22px}
#morePop button.on{background:var(--accent)}
#stylePanel{background:#161b21;color:#e9eef5;padding:8px 10px 6px;display:flex;flex-direction:column;gap:6px}
#stylePanel .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#stylePanel .hls{display:flex;gap:4px;flex:1}#stylePanel .hls button{flex:1;height:34px;border-radius:8px;background:rgba(255,255,255,.1);color:#e9eef5}#stylePanel .hls button.on{background:var(--accent);color:#fff}
#stylePanel .lo{height:34px;padding:0 12px;border-radius:8px;background:rgba(255,255,255,.1);color:#e9eef5}
#stylePanel .al{height:34px;padding:0 12px;border-radius:8px;background:rgba(255,255,255,.1);color:#e9eef5}#stylePanel .al.on{background:var(--accent);color:#fff}
#stylePanel .sws{gap:7px;flex:1;flex-wrap:nowrap;overflow-x:auto}
#stylePanel .sw{width:32px;height:32px;flex:none;border-color:#3a434e}
#stylePanel .sw.on{outline-offset:1px}
#stylePanel label.t{width:74px;font-size:12px;opacity:.85;flex:none}
#stylePanel input[type=range]{flex:1;min-width:0;height:28px}
#stylePanel .v{width:30px;text-align:right;font-size:13px;font-variant-numeric:tabular-nums}
#stylePanel .chk{margin:0;font-size:13px;gap:6px;flex:1}
#stylePanel .chk input{width:20px;height:20px}
#stylePanel .pk,#stylePanel .rs{height:34px;padding:0 12px;border-radius:8px;background:rgba(255,255,255,.1);color:#e9eef5}
#stylePanel .ok{height:38px;padding:0 18px;border-radius:8px;background:var(--accent);color:#fff;font-weight:600}
.pwm{-webkit-text-security:disc;text-security:disc}
#lockScr{position:fixed;inset:0;z-index:500;background:#1d2733;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
#lockScr .lk{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;color:#e9eef5}
#lockScr h2{margin:4px 0 8px;font-size:20px}#lockScr .inp{width:100%;text-align:center;font-size:20px;letter-spacing:2px}
#lockScr .btn{width:100%}#lockScr .lkm{min-height:20px;color:#ff8a80;margin:0}#lockScr .lkf{color:#9fb0c3;text-decoration:underline;font-size:14px;margin-top:8px}
#lockScr .lkr{font-size:14px;color:#c7d2de;text-align:left;line-height:1.45}
#busy{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
#busy span{background:#fff;padding:14px 22px;border-radius:12px}
</style>
</head>
<body>

<div id="listScreen">
  <header class="top"><button class="ibtn hidden" id="lsBack" data-ic="back" aria-label="Назад"></button><h1 id="lsTitle">Размеры на фото</h1><button class="ibtn" id="lsSync" data-ic="sync" aria-label="Синхронизировать"></button><button class="ibtn" id="lsMenu" data-ic="dots" aria-label="Меню"></button></header>
  <div id="crumbs" class="crumbs hidden"></div>
  <div class="newbar" id="newBar">
    <button class="big" id="btnGallery" data-ic="image">Из галереи</button>
    <button class="big alt" id="btnCamera" data-ic="camera">Камера</button>

/* ---------- IndexedDB ---------- */
let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('razmery_na_foto',2);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});
    if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos',{keyPath:'id'});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'});
    if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'id'});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function txDone(t){return new Promise((res,rej)=>{t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('abort'));});}
function reqP(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const dbGet=(s,k)=>reqP(db.transaction(s).objectStore(s).get(k));
const dbAll=s=>reqP(db.transaction(s).objectStore(s).getAll());
function dbPut(s,v){const t=db.transaction(s,'readwrite');t.objectStore(s).put(v);return txDone(t);}
function dbPutMany(items){const names=[...new Set(items.map(i=>i[0]))];const t=db.transaction(names,'readwrite');
  items.forEach(([s,v])=>t.objectStore(s).put(v));return txDone(t);}
async function gcFiles(){try{const ps=await dbAll('projects'),used=new Set(ps.filter(p=>p.src&&p.src.f).map(p=>p.src.f)),fs=await dbAll('files');
  const del=fs.filter(f=>!used.has(f.id));if(!del.length)return;const t=db.transaction('files','readwrite');del.forEach(f=>t.objectStore('files').delete(f.id));await txDone(t);}catch(e){}}
function dbDelMany(ids){const t=db.transaction(['projects','photos'],'readwrite');
  for(const id of ids){t.objectStore('projects').delete(id);t.objectStore('photos').delete(id);}return txDone(t);}
function dbDelProject(id){const t=db.transaction(['projects','photos'],'readwrite');
  t.objectStore('projects').delete(id);t.objectStore('photos').delete(id);return txDone(t);}

/* ---------- настройки ---------- */
let settings={hide:{mode:'pix',str:3,bw:32,brush:false},calc:'res',sym:{tol:true,base:true,rough:true,weld:true},orthoDeg:2,syncDelay:3600000,pdfIn:{dpi:200},pdf:{paper:'a4',dpi:150,mode:'over',all:true},expSize:0,stitch:{dir:'row',gap:1,bg:'#ffffff',cols:0},adjustOnLoad:true,color:'#e53935',lw:3,fs:36,halo:true,placeMode:'click3',angleRays:true,gridCols:2,ortho:true,snapPts:true,askName:true,hintOff:false,sort:'date',recent:[]};

/* ---------- утилиты ---------- */
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),2600);}
function busy(on,msg){$('#busy span').textContent=msg||'Подождите…';$('#busy').classList.toggle('hidden',!on);}
function loadImg(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob);const im=new Image();
  im.onload=()=>{if(im.decode)im.decode().then(()=>res(im),()=>res(im));else res(im);};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'));};im.src=u;});}
function freeSm(x){try{if(x.close)x.close();else{x.width=x.height=0;}}catch(e){}}
function imgSize(blob){return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{const r={w:im.naturalWidth,h:im.naturalHeight};URL.revokeObjectURL(u);res(r);};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'));};im.src=u;});}
async function smallImage(blob,w,h,max=1600){const k=Math.min(1,max/Math.max(w,h)),rw=Math.max(1,Math.round(w*k)),rh=Math.max(1,Math.round(h*k));
  if(window.createImageBitmap){try{const b=await createImageBitmap(blob,{resizeWidth:rw,resizeHeight:rh,resizeQuality:'high',imageOrientation:'from-image'});if(b.width===rw&&b.height===rh)return b;b.close&&b.close();}catch(e){}}
  const im=await loadImg(blob);const c=document.createElement('canvas');c.width=rw;c.height=rh;c.getContext('2d').drawImage(im,0,0,rw,rh);URL.revokeObjectURL(im.src);return c;}
async function makePreview(im,w,h){const k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);const b=await toBlob(c,'image/jpeg',0.85);c.width=c.height=0;return b;}
const toBlob=(c,type,q)=>new Promise(res=>c.toBlob(res,type,q));
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
function dataUrlToBlob(u){const i=u.indexOf(',');const type=u.slice(5,i).split(';')[0];const bin=atob(u.slice(i+1));
  const a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new Blob([a],{type});}
function download(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
const safeName=s=>(s||'проект').replace(/[\\/:*?"<>|]+/g,'_').trim().slice(0,80)||'проект';

/* ---------- окна ---------- */
let modalClose=null,modalOpenedAt=0;
function modal(build){return new Promise(res=>{const ov=$('#ov'),box=$('#mbox');box.innerHTML='';ov.classList.remove('hidden');modalOpenedAt=Date.now();
  let done=false;const close=v=>{if(done)return;done=true;ov.classList.add('hidden');box.innerHTML='';modalClose=null;res(v===undefined?null:v);};
  modalClose=close;build(box,close);});}
// Касание пальцем порождает запоздалый «клик» в той же точке: он не должен закрывать только что открытое окно
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&modalClose&&Date.now()-modalOpenedAt>600)modalClose(null);});
/* калькулятор в строке размера: «Ø 20+5» → «Ø25»; × не считается умножением (фаски 2×45°, резьба M8×1) */
function calcParse(s){const m=(s||'').match(/^\s*([ØøR⌀M]?)\s*(\d+(?:[.,]\d+)?(?:\s*[-+*/÷:]\s*\d+(?:[.,]\d+)?)+)\s*(мм|см|°)?\s*$/i);if(!m)return null;
  const toks=m[2].replace(/\s+/g,'').match(/\d+(?:[.,]\d+)?|[-+*/÷:]/g),num=t=>parseFloat(t.replace(',','.'));
  const vals=[num(toks[0])],ops=[];for(let i=1;i<toks.length;i+=2){const op=toks[i],v=num(toks[i+1]);
    if(op==='*'){vals.push(vals.pop()*v);}else if(op==='/'||op==='÷'||op===':'){if(!v)return null;vals.push(vals.pop()/v);}else{ops.push(op);vals.push(v);}}
  let r=vals[0];ops.forEach((op,i)=>{r=op==='+'?r+vals[i+1]:r-vals[i+1];});if(!isFinite(r))return null;
  let rs=String(+r.toFixed(3));if(/,/.test(m[2]))rs=rs.replace('.',',');
  return {pre:m[1],expr:m[2].replace(/\s+/g,''),res:rs,post:m[3]||''};}
function insertAtCursor(inp,s){const a=inp.selectionStart??inp.value.length,b=inp.selectionEnd??a;
  inp.value=inp.value.slice(0,a)+s+inp.value.slice(b);inp.selectionStart=inp.selectionEnd=a+s.length;inp.focus();}
function askText(title,value,opts={}){return modal((box,close)=>{
  box.innerHTML=`<h3></h3>${opts.multiline?'<textarea class="inp" rows="4"></textarea>':'<input type="text" class="inp" autocomplete="off" enterkeyhint="done">'}${opts.calc?'<div class="calc hidden"><span class="cv"></span><button class="cx">не считать</button></div>':''}${opts.recent&&opts.recent.length?'<div class="recent hidden"></div>':''}${opts.chips?'<div class="chips"></div>':''}
  ${opts.tol?'<button class="tolb">± Допуск в два яруса</button><div class="tolf hidden"><input class="inp sm tu" placeholder="верхнее, напр. +0,1" autocomplete="off"><input class="inp sm tl" placeholder="нижнее, напр. −0,2" autocomplete="off"></div>':''}
  <div class="mbtns">${opts.recent&&opts.recent.length?'<button class="btn ghost rcb" style="margin-right:auto;padding:0 10px">🕘 Недавние</button>':''}<button class="btn" data-a="c">Отмена</button><button class="btn pri" data-a="ok">OK</button></div>`;
  box.querySelector('h3').textContent=title;const inp=box.querySelector('.inp');
  if(box.querySelector('.rcb')){const rb=box.querySelector('.rcb');rb.addEventListener('pointerdown',e=>e.preventDefault());rb.onclick=()=>{const r=box.querySelector('.recent');r.classList.toggle('hidden');rb.classList.toggle('pri',!r.classList.contains('hidden'));};}inp.value=value||'';inp.placeholder=opts.placeholder||'';
  if(opts.recent&&opts.recent.length){const rr=box.querySelector('.recent');for(const t of opts.recent){const b=document.createElement('button');
    b.className='chip';b.textContent=t;b.title='Недавнее значение';b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>close(t);rr.appendChild(b);}}
  if(opts.chips){const cr=box.querySelector('.chips');for(const [lab,ins] of opts.chips){const b=document.createElement('button');
    b.className='chip';b.textContent=lab;b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>insertAtCursor(inp,ins);cr.appendChild(b);}}
  let noCalc=false;const cb=box.querySelector('.calc');
  const updCalc=()=>{if(!cb)return;const r=noCalc?null:calcParse(inp.value);cb.classList.toggle('hidden',!r);if(r)cb.querySelector('.cv').textContent=`= ${r.pre}${r.res}${r.post}`+(settings.calc==='keep'?' · выражение сохранится':'');};
  if(cb){inp.addEventListener('input',updCalc);const x=cb.querySelector('.cx');x.addEventListener('pointerdown',e=>e.preventDefault());x.onclick=()=>{noCalc=true;updCalc();};}
  const tb=box.querySelector('.tolb');if(tb){const f=box.querySelector('.tolf'),tu=f.querySelector('.tu'),tl=f.querySelector('.tl');tu.value=opts.tol.u||'';tl.value=opts.tol.l||'';
    const show=()=>{f.classList.remove('hidden');tb.classList.add('on');};if(tu.value||tl.value)show();tb.onclick=()=>{f.classList.contains('hidden')?(show(),tu.focus()):(f.classList.add('hidden'),tb.classList.remove('on'));};
    [tu,tl].forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();finish();}}));}
  const finish=()=>{let v=inp.value.trim();const ex={};
    if(cb&&!noCalc){const r=calcParse(v);if(r){if(settings.calc==='keep')ex.expr=v;v=r.pre+r.res+r.post;}}
    if(tb){const f=box.querySelector('.tolf'),fx=t=>t.trim().replace(/^-/,'−');ex.tol={u:fx(f.querySelector('.tu').value),l:fx(f.querySelector('.tl').value)};
      if(ex.tol.u&&!/^[+−±]/.test(ex.tol.u)&&/^\d/.test(ex.tol.u))ex.tol.u='+'+ex.tol.u;}
    if(opts.calc||opts.tol)dlgExtra=ex;close(v);};
  box.querySelector('[data-a=c]').onclick=()=>close(null);
  box.querySelector('[data-a=ok]').onclick=finish;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&(!opts.multiline||e.ctrlKey||e.metaKey)){e.preventDefault();finish();}});
  updCalc();
  setTimeout(()=>{inp.focus();if(opts.caretEnd){const n=inp.value.length;inp.setSelectionRange(n,n);}else inp.select();},50);});}
const askLabel=v=>askText('Надпись',v,{multiline:true,placeholder:'Текст надписи (Enter — новая строка)',chips:[['Ø','Ø'],['R','R'],['мм',' мм'],['±','±'],['°','°'],['×','×']]});
function rememberText(t){t=(t||'').trim();if(!t||t==='Ø'||t==='R')return;settings.recent=[t,...(settings.recent||[]).filter(x=>x!==t)].slice(0,8);saveSettings();}

let dlgExtra=null;

    chips:[['Ø','Ø'],['R','R'],['мм',' мм'],['±','±'],['°','°'],['×','×']],calc:settings.calc!=='off',tol:st.tol!==false?(o&&o.tol||{u:'',l:''}):null});}

      Promise.resolve(fd.initialize?fd.initialize():null).then(()=>{fd.setOptions({model:'full',minDetectionConfidence:0.5});res(fd);},rej);}catch(e){rej(e);}};
    if(window.FaceDetection)return go();const sc=document.createElement('script');sc.src='./lib/fd/face_detection.js';sc.onload=go;sc.onerror=()=>rej(new Error('lib'));document.head.appendChild(sc);})
    .catch(e=>{fdP=null;throw e;});return fdP;}

  items.push(['meta',{key:'folders',value:merged}],['meta',{key:'folderTomb',value:tomb}],['meta',{key:'purged',value:{}}]);
  await dbPutMany(items);if(localDel.length){await dbDelMany(localDel);gcFiles();}
  folders=merged;folderTomb=tomb;purged={};syncState={known,lastSync:Date.now()};await dbPut('meta',{key:'sync',value:syncState});
  return {up,down,del,conf,fChanged};}

/* ---------- защита: пароль / PIN и отпечаток (WebAuthn) ---------- */
// Закрывает экран приложения. Хранится в localStorage (ключ только этого приложения): соль и хэш PBKDF2, id ключа отпечатка.
const LOCK_KEY='razmery.lock';
function lockCfg(){try{const c=JSON.parse(localStorage.getItem(LOCK_KEY)||'null');return c&&c.hash?c:null;}catch(e){return null;}}
function saveLock(c){try{if(c)localStorage.setItem(LOCK_KEY,JSON.stringify(c));else localStorage.removeItem(LOCK_KEY);}catch(e){}}
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),ub64=t=>Uint8Array.from(atob(t),ch=>ch.charCodeAt(0));
async function pwHash(pw,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub64(salt),iterations:iter,hash:'SHA-256'},k,256));}
async function setPassword(pw){const salt=b64(crypto.getRandomValues(new Uint8Array(16))),iter=150000,c=lockCfg()||{after:5};
  Object.assign(c,{v:1,salt,iter,hash:await pwHash(pw,salt,iter),pin:/^\d+$/.test(pw)});saveLock(c);}
async function bioAvailable(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}}
async function bioRegister(){const cr=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Размеры на фото',id:location.hostname},
  user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'razmery',displayName:'Размеры на фото'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
  authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});return b64(cr.rawId);}
async function bioCheck(id){const r=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,
  allowCredentials:[{type:'public-key',id:ub64(id),transports:['internal']}],userVerification:'required',timeout:60000}});return !!r;}
let appLocked=false,hiddenAt=0,lockTries=0,lockUntil=0;
function showLock(){const c=lockCfg();if(!c||appLocked)return;appLocked=true;const el=$('#lockScr');el.classList.remove('hidden');
  el.innerHTML=`<div class="lk"><img src="icon-192.png" width="72" height="72" alt=""><h2>Размеры на фото</h2>
  <input type="text" class="inp lkp pwm" name="rz-lock-${Date.now()}" placeholder="${c.pin?'PIN-код':'Пароль'}" ${c.pin?'inputmode="numeric" pattern="[0-9]*"':''} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore enterkeyhint="go">
  <button class="btn pri lkg">Войти</button>${c.bio?'<button class="btn ghost lkb">Отпечаток или лицо</button>':''}<p class="lkm"></p><button class="lkf">Забыли пароль?</button></div>`;
  const q=x=>el.querySelector(x),p=q('.lkp'),msg=t=>q('.lkm').textContent=t;
  const go=async()=>{const w=lockUntil-Date.now();if(w>0){msg(`Подождите ${Math.ceil(w/1000)} с`);return;}
    if(await pwHash(p.value,c.salt,c.iter)===c.hash){unlock();return;}p.value='';lockTries++;
    if(lockTries>=5){lockTries=0;lockUntil=Date.now()+30000;msg('5 неверных попыток — подождите 30 с');}else msg('Неверно');};
  q('.lkg').onclick=go;p.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
  const bio=async()=>{try{if(await bioCheck(c.bio))unlock();}catch(e){msg('Не получилось — введите '+(c.pin?'PIN-код':'пароль'));p.focus();}};
  if(c.bio){q('.lkb').onclick=bio;setTimeout(bio,250);}else setTimeout(()=>p.focus(),100);
  q('.lkf').onclick=()=>{q('.lk').innerHTML=`<h2>Пароль не восстанавливается</h2><p class="lkr">Можно удалить все проекты «Размеров на фото» на этом устройстве и снять защиту. Другие приложения не затрагиваются.
    Потом проекты вернутся синхронизацией с GitHub (⟳) или из резервной копии.</p><input class="inp lkd" placeholder="напишите УДАЛИТЬ" autocomplete="off">
    <button class="btn lkx" style="background:#c62828;color:#fff">Удалить проекты и снять защиту</button><button class="btn ghost lkc">Назад</button>`;
    el.querySelector('.lkc').onclick=()=>{appLocked=false;showLock();};
    el.querySelector('.lkx').onclick=async()=>{if(el.querySelector('.lkd').value.trim().toUpperCase()!=='УДАЛИТЬ')return;
      try{db&&db.close();}catch(e){}saveLock(null);await new Promise(r=>{const d=indexedDB.deleteDatabase('razmery_na_foto');d.onsuccess=d.onerror=d.onblocked=()=>r();});location.reload();};};}
function unlock(){appLocked=false;lockTries=0;const el=$('#lockScr');el.classList.add('hidden');el.innerHTML='';}
document.addEventListener('visibilitychange',()=>{const c=lockCfg();if(!c)return;
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();if(c.after===0)showLock();}
  else if(c.after>0&&hiddenAt&&Date.now()-hiddenAt>=c.after*60000)showLock();});
showLock();

/* ---------- запуск ---------- */
(async()=>{
  try{db=await openDB();}catch(e){alertBox('Хранилище недоступно','Браузер не дал доступ к IndexedDB. Проекты не смогут сохраняться.');return;}
  await loadSettings();await loadBk();await loadFolders();await loadSync();await purgeTrash();renderList();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
})();
/* ---------- обновление приложения ---------- */
let swReg=null;
const showUpd=()=>$('#updBar').classList.remove('hidden');
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloading)return;reloading=true;location.reload();});
  navigator.serviceWorker.register('sw.js').then(reg=>{swReg=reg;
    if(reg.waiting&&navigator.serviceWorker.controller)showUpd();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpd();});});
  }).catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&swReg)swReg.update().catch(()=>{});});
}
async function checkUpdate(){
  if(!swReg){toast('Обновления доступны только в установленной версии');return;}
  if(swReg.waiting){showUpd();return;}
  toast('Проверка…');try{await swReg.update();}catch(e){toast('Нет связи с сервером');return;}
  setTimeout(()=>{if(swReg.waiting||swReg.installing)showUpd();else toast(`Установлена последняя версия (${APP_VERSION})`);},1500);}
$('#updBtn').onclick=async()=>{if(proj)await flushAll();const w=swReg&&swReg.waiting;if(w)w.postMessage('SKIP_WAITING');else location.reload();};
</script>
